<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenario Diagram</title>
<style>
  :root {
    --bg:#0a0e14; --panel:#111721; --card:#131a26; --border:#233044; --border-hi:#2e415e;
    --fg:#dbe4f0; --muted:#7d8da3; --accent:#4d9fff; --accent2:#7c5cff;
    --ok:#3fd97f; --bad:#ff5c66; --warn:#e0a53f; --skip:#6e7f95;
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
  #app{max-width:1180px;margin:0 auto;padding:24px}
  .stage{border:1px solid var(--border);border-radius:12px;background:linear-gradient(180deg,var(--panel),#0e131c);padding:12px}
  svg{display:block;width:100%}

  /* PITFALL 1: state rules MUST repeat the #app prefix — an id-prefixed base rule (1,1,0)
     beats any unprefixed state rule (0,x,0). */
  #app .node-rect{fill:var(--card);stroke:var(--border);stroke-width:1.25;transition:none}
  #app .node.st-running .node-rect{stroke:var(--accent);stroke-width:2;animation:pulse 1.1s ease-in-out infinite}
  #app .node.st-pass   .node-rect{stroke:var(--ok);stroke-width:2}
  #app .node.st-fail   .node-rect{stroke:var(--bad);stroke-width:2.2}
  #app .node.st-skip   .node-rect{stroke:var(--skip);stroke-dasharray:4 3}
  #app .node.st-cancel .node-rect{stroke:var(--warn)}
  #app .node.st-pending .node-rect{stroke:var(--warn);animation:blink 1.6s ease-in-out infinite}
  #app .node-title{font-size:12.5px;font-weight:600;fill:var(--fg)}
  #app .node-sub{font-size:9.5px;fill:var(--muted)}
  #app .lane-label{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
  #app .plane-outline{fill:none;stroke:var(--border);stroke-dasharray:5 4}
  #app .chip-rect{fill:rgba(77,159,255,.14);stroke:rgba(77,159,255,.45);stroke-width:.8}
  #app .chip-text{font-size:6.8px;letter-spacing:.06em;fill:var(--accent);font-weight:700}
  .haltpct{font-size:10px;font-weight:700;fill:var(--bad)}

  /* PITFALL 2: NO transitions on stroke/opacity — frozen in throttled tabs. Animations run fine. */
  #app .edge{stroke:var(--border-hi);stroke-width:1.4;fill:none;opacity:.18}
  #app .edge.active{stroke:var(--ok);opacity:1;stroke-dasharray:6 6;animation:ants .5s linear infinite}
  #app .edge.lit{opacity:1;stroke:var(--ok)}
  #app .edge.blocked{stroke:var(--bad)!important;opacity:1;stroke-dasharray:4 4}

  @keyframes pulse{50%{stroke-opacity:.35}}
  @keyframes blink{50%{stroke-opacity:.3}}
  @keyframes ants{to{stroke-dashoffset:-12}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .fx-shake{animation:shake .3s linear 2}
</style>
</head>
<body>
<div id="app">
  <div class="stage"><svg id="dag" viewBox="0 0 1120 540"></svg></div>
  <div id="ticker" style="font:12px ui-monospace,monospace;color:var(--accent);margin-top:10px">press a scenario…</div>
  <div class="btns" id="btns" style="display:flex;gap:7px;margin-bottom:10px"></div>
</div>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("dag"), ticker=document.getElementById("ticker");

  /* Spine left→right on top; lanes below. Inputs enter a box's LEFT edge, outputs exit RIGHT. */
  var NODES=[
    {id:"trigger",x:8,  y:34,w:110,h:60,t:"push / PR",s:"event"},
    {id:"build",  x:150,y:34,w:150,h:60,t:"build",  s:"does the thing",chip:true},
    {id:"deploy", x:360,y:34,w:150,h:60,t:"deploy", s:"ships it",chip:true}
  ];
  /* Every edge is a HAND-ROUTED path. Endpoints must land ON borders (±3px). */
  var EDGES=[
    {d:"M118,64 L150,64",from:"trigger",to:"build"},
    {d:"M300,64 L360,64",from:"build",to:"deploy",cls:"push",label:"artifact",lx:330,ly:55}
  ];
  /* PITFALL 4: beat `at` is ABSOLUTE ms from run start — never chain implicitly. */
  var SCENARIOS={
    happy:[{at:0,n:"trigger",st:"running"},{at:300,n:"trigger",st:"pass"},
           {at:400,n:"build",st:"running"},{at:2000,n:"build",st:"pass"},
           {at:2200,n:"deploy",st:"running"},{at:3200,n:"deploy",st:"pass",log:"shipped"}],
    fail: [{at:0,n:"trigger",st:"running"},{at:300,n:"trigger",st:"pass"},
           {at:400,n:"build",st:"running"},{at:2000,n:"build",st:"fail",log:"build failed"},
           {at:2300,n:"deploy",st:"skip"}]
  };

  var nodeEls={},states={},timers=[],tags=[];
  var byId={}; NODES.forEach(function(n){byId[n.id]=n;});

  function mkNode(n){
    var g=document.createElementNS(NS,"g"); g.setAttribute("class","node st-waiting");
    var r=document.createElementNS(NS,"rect");
    r.setAttribute("x",n.x);r.setAttribute("y",n.y);r.setAttribute("width",n.w);r.setAttribute("height",n.h);
    r.setAttribute("rx",9);r.setAttribute("class","node-rect");g.appendChild(r);
    var t1=document.createElementNS(NS,"text");t1.setAttribute("x",n.x+12);t1.setAttribute("y",n.y+24);
    t1.setAttribute("class","node-title");t1.textContent=n.t;g.appendChild(t1);
    var t2=document.createElementNS(NS,"text");t2.setAttribute("x",n.x+12);t2.setAttribute("y",n.y+42);
    t2.setAttribute("class","node-sub");t2.textContent=n.s;g.appendChild(t2);
    if(n.chip){var cr=document.createElementNS(NS,"rect");
      cr.setAttribute("x",n.x+n.w-62);cr.setAttribute("y",n.y+4);cr.setAttribute("width",56);cr.setAttribute("height",13);cr.setAttribute("rx",6);cr.setAttribute("class","chip-rect");g.appendChild(cr);
      var ct=document.createElementNS(NS,"text");ct.setAttribute("x",n.x+n.w-34);ct.setAttribute("y",n.y+13.5);ct.setAttribute("text-anchor","middle");ct.setAttribute("class","chip-text");ct.textContent="NEW RUNNER";g.appendChild(ct);}
    svg.appendChild(g);nodeEls[n.id]=g;
  }

  var defs=document.createElementNS(NS,"defs");
  defs.innerHTML='<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--border-hi)"></path></marker>';
  svg.appendChild(defs);

  var edgeEls=[];
  EDGES.forEach(function(e){
    var p=document.createElementNS(NS,"path");p.setAttribute("class","edge"+(e.cls?" "+e.cls:""));
    p.setAttribute("d",e.d);p.setAttribute("marker-end","url(#arrow)");svg.appendChild(p);
    edgeEls.push({p:p,from:e.from,to:e.to});
  });
  NODES.forEach(mkNode);

  var inEdges={};edgeEls.forEach(function(e){(inEdges[e.to]=inEdges[e.to]||[]).push(e);});

  function log(m,t){ticker.textContent="T+"+t.toFixed(1)+"s — "+m;}

  /* PITFALL 5: ONE tag per node — new replaces old, or QUEUED… and STOP stack at the same coords. */
  function addTag(id,text){
    for(var i=tags.length-1;i>=0;i--) if(tags[i].id===id){tags[i].el.remove();tags.splice(i,1);}
    var n=byId[id],t=document.createElementNS(NS,"text");
    t.setAttribute("x",n.x+n.w/2);t.setAttribute("y",n.y+n.h+15);t.setAttribute("text-anchor","middle");
    t.setAttribute("class","haltpct");t.textContent=text;svg.appendChild(t);tags.push({id:id,el:t});
  }
  function dropTag(id){for(var i=tags.length-1;i>=0;i--) if(tags[i].id===id){tags[i].el.remove();tags.splice(i,1);}}

  function haltFx(id){
    var g=nodeEls[id];g.classList.add("fx-shake");           /* PITFALL 3: never add("a b") — separate calls only */
    setTimeout(function(){g.classList.remove("fx-shake");},800);
    (inEdges[id]||[]).forEach(function(e){
      e.p.classList.add("blocked");
      setTimeout(function(){e.p.classList.remove("blocked");},900);
    });
    addTag(id,"STOP");
  }

  function setState(id,st){
    states[id]=st;var g=nodeEls[id];
    g.classList.remove("st-running","st-pass","st-fail","st-skip","st-cancel","st-pending","st-waiting");
    g.classList.add("st-"+st);
    if(st==="running")(inEdges[id]||[]).forEach(function(e){if(states[e.from]==="pass"){e.p.classList.add("active");}});
    if(st==="pass")(inEdges[id]||[]).forEach(function(e){e.p.classList.remove("active");e.p.classList.add("lit");});
    if(st==="skip"){(inEdges[id]||[]).forEach(function(e){e.p.classList.remove("active","lit");e.p.style.opacity=".28";});dropTag(id);} /* skipped ⇒ not queued */
    if(st==="fail"||st==="cancel")haltFx(id);
    if(st==="pending")addTag(id,"QUEUED\u2026");
  }

  /* PITFALL 10: apply log AND state together — never return before the state change. */
  function exec(ev,t0){
    if(ev.log!==undefined)log(ev.log,(Date.now()-t0)/1000);
    if(ev.n){setState(ev.n,ev.st);return;}
  }

  function resetVisual(){
    timers.forEach(clearTimeout);timers=[];
    tags.forEach(function(t){t.el.remove();});tags=[];
    NODES.forEach(function(n){var g=nodeEls[n.id];
      g.classList.remove("st-running","st-pass","st-fail","st-skip","st-cancel","st-pending","fx-shake");
      g.classList.add("st-waiting");states[n.id]="waiting";});
    edgeEls.forEach(function(e){e.p.classList.remove("active","lit","blocked");e.p.style.opacity="";});
  }
  function play(id){
    resetVisual();var t0=Date.now();
    SCENARIOS[id].forEach(function(ev){timers.push(setTimeout(function(){exec(ev,t0);},ev.at));});
  }

  var wrap=document.getElementById("btns");
  Object.keys(SCENARIOS).forEach(function(id){
    var b=document.createElement("button");b.textContent=id;b.style.cssText="padding:7px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer";
    b.onclick=function(){play(id);};wrap.appendChild(b);
  });
  play(Object.keys(SCENARIOS)[0]);

  /* Geometry self-test — run via browser_exec js(). Must return all-empty arrays. */
  window.__verifyGeometry=function(){
    var rects=NODES.map(function(n){return{id:n.id,x:n.x,y:n.y,w:n.w,h:n.h};});
    var hits=[];
    edgeEls.forEach(function(e){
      var L=e.p.getTotalLength(),N=Math.max(60,Math.floor(L/6));
      for(var i=5;i<N-5;i++){var pt=e.p.getPointAtLength(L*i/N);
        for(var j=0;j<rects.length;j++){var r=rects[j];
          if(pt.x>r.x+1&&pt.x<r.x+r.w-1&&pt.y>r.y+1&&pt.y<r.y+r.h-1){hits.push([r.id]);break;}}}
    });
    var vw=svg.viewBox.baseVal,out=[];
    Array.prototype.forEach.call(svg.querySelectorAll('text'),function(t){var b=t.getBBox();
      if(b.x+b.width>vw.width+2||b.y+b.height>vw.height+2||b.x<-2)out.push([t.textContent.slice(0,20)]);});
    return JSON.stringify({edgeCollisions:hits.filter(function(v,i,a){return a.indexOf(v)===i;}),outOfView:out});
  };
})();
</script>
</body>
</html>
